services:
  - type: web
    name: stock-sub-dashboard
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --workers 1 --threads 4 --timeout 120 dashboard:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUBS
        value: "wallstreetbets,stocks,investing,options,StockMarket,pennystocks,SPACs"
      - key: POST_SUBS
        value: "stocks,investing,options,StockMarket,pennystocks,SPACs"
      - key: CACHE_TTL
        value: "3600"
      - key: POSTS_PER_SUB
        value: "30"
      - key: POST_LOOKBACK_DAYS
        value: "7"