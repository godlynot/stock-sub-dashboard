services:
  - type: web
    name: stock-sub-dashboard
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --workers 1 --threads 4 --timeout 120 dashboard:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUBS
        value: "wallstreetbets,wallstreetbetsnew,stocks,investing,options,StockMarket,pennystocks,SPACs,Superstonk,SNDK,MSTR,amcstock,nvidia,BBBY"
      - key: POST_SUBS
        value: "wallstreetbetsnew,stocks,investing,options,StockMarket,pennystocks,SPACs,Superstonk,SNDK,MSTR,amcstock,nvidia,BBBY"
      - key: COMMENT_SUBS
        value: "wallstreetbets,wallstreetbetsnew,stocks,investing,options,StockMarket,Superstonk,nvidia"
      - key: CACHE_TTL
        value: "3600"
      - key: PRICE_CACHE_TTL
        value: "300"
      - key: MACRO_CACHE_TTL
        value: "900"
      - key: POSTS_PER_SUB
        value: "300"
      - key: POST_LOOKBACK_DAYS
        value: "7"
      - key: POST_BODY_EXTRACT_CHARS
        value: "5000"